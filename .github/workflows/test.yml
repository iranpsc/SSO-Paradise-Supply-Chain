name: Laravel Tests & Coverage

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # اجرای تست‌ها هر یک ساعت
  # schedule:
  #   - cron: "0 * * * *"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  # ============================================================
  # Laravel Tests
  # ============================================================

  laravel-tests:

    name: 🧪 Laravel Tests & Coverage

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:5.7

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sso

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # Setup PHP
      # ============================================================

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

          extensions: >
            mbstring,
            xml,
            ctype,
            json,
            bcmath,
            tokenizer,
            pdo,
            pdo_mysql

          coverage: pcov

          tools: composer:v2


      # ============================================================
      # Check PHP & Composer
      # ============================================================

      - name: 🔍 Check PHP & Composer Version
        run: |
          php -v
          composer --version


      # ============================================================
      # Install Composer Dependencies
      # ============================================================

      - name: 📦 Install Composer Dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction \
            --optimize-autoloader


      # ============================================================
      # Prepare Laravel Environment
      # ============================================================

      - name: ⚙️ Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate


      # ============================================================
      # Configure Database
      # ============================================================

      - name: 🗄️ Configure Test Database
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=sso/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env


      # ============================================================
      # Run Migrations
      # ============================================================

      - name: 🗄️ Run Database Migrations
        run: |
          php artisan migrate --force


      # ============================================================
      # Setup Node.js
      # ============================================================

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm


      # ============================================================
      # Install NPM Dependencies
      # ============================================================

      - name: 📦 Install NPM Dependencies
        run: |
          npm ci


      # ============================================================
      # Build Frontend
      # ============================================================

      - name: 🏗️ Build Frontend
        run: |
          npm run build


      # ============================================================
      # Run Laravel Tests
      # ============================================================
      #
      # IMPORTANT:
      # - Tests run only ONCE
      # - Coverage minimum is 100%
      # - JUnit XML is generated
      #
      # ============================================================

      - name: 🧪 Run Laravel Tests & Generate Coverage
        id: tests
        continue-on-error: true
        run: |
          php artisan test \
            --coverage \
            --min=100 \
            --log-junit=test-results.xml \
            2>&1 | tee test-output.txt

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          exit $TEST_EXIT_CODE


      # ============================================================
      # Generate GitHub Actions Summary
      # ============================================================

      - name: 📝 Generate Test Summary
        if: always()
        shell: bash
        run: |

          echo "# 🧪 Laravel Test & Coverage Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📊 Test Summary" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

          # ------------------------------------------------------------
          # Extract test statistics from PHPUnit output
          # ------------------------------------------------------------

          if [ -f test-output.txt ]; then

            TESTS=$(grep -oP 'Tests:\s+\K[0-9]+' test-output.txt | tail -1 || true)

            FAILED=$(grep -oP '[0-9]+(?=\s+failed)' test-output.txt | tail -1 || true)

            PASSED=$(grep -oP '[0-9]+(?=\s+passed)' test-output.txt | tail -1 || true)

            SKIPPED=$(grep -oP '[0-9]+(?=\s+skipped)' test-output.txt | tail -1 || true)

            if [ -z "$TESTS" ]; then
              TESTS="N/A"
            fi

            if [ -z "$FAILED" ]; then
              FAILED="0"
            fi

            if [ -z "$PASSED" ]; then
              PASSED="N/A"
            fi

            if [ -z "$SKIPPED" ]; then
              SKIPPED="0"
            fi

          else

            TESTS="N/A"
            FAILED="N/A"
            PASSED="N/A"
            SKIPPED="N/A"

          fi


          # ------------------------------------------------------------
          # Extract Coverage
          # ------------------------------------------------------------

          COVERAGE="N/A"

          if [ -f test-output.txt ]; then

            COVERAGE=$(grep -oP 'Lines:\s+\K[0-9.]+(?=%)' test-output.txt | tail -1 || true)

          fi


          # ------------------------------------------------------------
          # Workflow Status
          # ------------------------------------------------------------

          if [ "${TEST_EXIT_CODE:-1}" -eq 0 ]; then
            STATUS="✅ PASSED"
          else
            STATUS="❌ FAILED"
          fi


          # ------------------------------------------------------------
          # Main Summary Table
          # ------------------------------------------------------------

          echo "| 🧪 Test Suite | Laravel |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🧪 Total Tests | **$TESTS** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| ✅ Passed | **$PASSED** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| ❌ Failed | **$FAILED** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| ⏭️ Skipped | **$SKIPPED** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 📈 Total Coverage | **$COVERAGE%** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🎯 Required Coverage | **100%** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🚦 Workflow Status | **$STATUS** |" >> "$GITHUB_STEP_SUMMARY"


          # ============================================================
          # Coverage Output
          # ============================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📈 Coverage Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          if [ -f test-output.txt ]; then

            sed -n '/Coverage:/,$p' test-output.txt >> "$GITHUB_STEP_SUMMARY"

          else

            echo "❌ Coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"

          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"


          # ============================================================
          # Full Test Output
          # ============================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🧪 Test Details" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          if [ -f test-output.txt ]; then

            cat test-output.txt >> "$GITHUB_STEP_SUMMARY"

          else

            echo "❌ Test output was not generated." >> "$GITHUB_STEP_SUMMARY"

          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # Publish Test Results
      # ============================================================

      - name: 📊 Publish Test Results
        if: always() && hashFiles('test-results.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          name: 🧪 Laravel Test Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false


      # ============================================================
      # Upload Test Results
      # ============================================================

      - name: 📄 Upload Test Results
        if: always() && hashFiles('test-results.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: laravel-test-results
          path: test-results.xml


      # ============================================================
      # Upload Full Test Output
      # ============================================================

      - name: 📄 Upload Test Output
        if: always() && hashFiles('test-output.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: laravel-test-output
          path: test-output.txt


      # ============================================================
      # Final Job Status
      # ============================================================
      #
      # Because the test step uses continue-on-error,
      # we explicitly fail the job here if tests failed.
      #
      # ============================================================

      - name: 🚦 Final Test Status
        if: always()
        run: |

          if [ "${TEST_EXIT_CODE:-1}" -ne 0 ]; then

            echo "❌ Laravel tests or coverage check failed."

            exit 1

          fi

          echo "✅ All Laravel tests passed."

          echo "✅ Coverage is at least 100%."


  # ============================================================
  # Slack Notification
  # ============================================================

  notify_slack:

    name: 🔔 Notify Slack

    runs-on: ubuntu-latest

    needs:
      - laravel-tests

    if: ${{ needs.laravel-tests.result == 'failure' }}

    steps:

      - name: 🔔 Send Slack Notification
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook

          payload: |
            {
              "text": "❌ Laravel Tests Failed",
              "attachments": [
                {
                  "color": "danger",
                  "text": "Laravel tests or coverage check failed. Please check the GitHub Actions run."
                }
              ]
            }

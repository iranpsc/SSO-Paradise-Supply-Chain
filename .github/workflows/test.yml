name: Laravel Tests & Coverage

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # اجرای تست‌ها هر یک ساعت
  # schedule:
  #   - cron: "0 * * * *"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  # ==================================================
  # Laravel Tests & Coverage
  # ==================================================

  laravel-tests:

    name: 🧪 Laravel Tests & Coverage

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:5.7

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sso

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # ==================================================
      # Checkout
      # ==================================================

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # Setup PHP
      # ==================================================

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2

        with:
          php-version: "8.1"

          extensions: >
            mbstring,
            xml,
            ctype,
            json,
            bcmath,
            tokenizer,
            pdo,
            pdo_mysql

          coverage: pcov

          tools: composer:v2


      # ==================================================
      # Install Composer Dependencies
      # ==================================================

      - name: 📦 Install Composer Dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction \
            --optimize-autoloader


      # ==================================================
      # Prepare Environment
      # ==================================================

      - name: ⚙️ Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate


      # ==================================================
      # Configure Database
      # ==================================================

      - name: 🗄️ Configure Test Database
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=sso/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env


      # ==================================================
      # Check MySQL
      # ==================================================

      - name: 🩺 Check MySQL Connection
        run: |
          php artisan migrate --force


      # ==================================================
      # Setup Node.js
      # ==================================================

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"

          cache: npm


      # ==================================================
      # Install NPM Dependencies
      # ==================================================

      - name: 📦 Install NPM Dependencies
        run: |
          npm ci


      # ==================================================
      # Build Frontend
      # ==================================================

      - name: 🏗️ Build Frontend
        run: |
          npm run build


      # ==================================================
      # Run Laravel Tests + Coverage
      # ==================================================

      - name: 🧪 Run Laravel Tests & Coverage
        run: |
          php artisan test \
            --coverage \
            --min=70 \
            --log-junit=test-results.xml


      # ==================================================
      # Publish Test Results
      # ==================================================

      - name: 📊 Publish Test Results
        if: always()

        uses: dorny/test-reporter@v2

        with:
          name: 🧪 Laravel Test Results

          path: test-results.xml

          reporter: java-junit

          fail-on-error: true


      # ==================================================
      # Generate GitHub Summary
      # ==================================================

      - name: 📝 Generate Test Summary
        if: always()

        shell: bash

        run: |

          echo "# 🧪 Laravel Test & Coverage Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📊 Test Summary" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"

          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🧪 Test Suite | Laravel |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🎯 Required Coverage | **70%** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🚦 Workflow Status | **${{ job.status }}** |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📈 Coverage" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          php artisan test \
            --coverage \
            --min=70 \
            2>&1 | tee coverage-summary.txt || true

          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"


      # ==================================================
      # Upload Test Results
      # ==================================================

      - name: 📄 Upload Test Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: laravel-test-results

          path: test-results.xml


      # ==================================================
      # Upload Coverage Summary
      # ==================================================

      - name: 📈 Upload Coverage Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: laravel-coverage-report

          path: coverage-summary.txt


  # ==================================================
  # Slack Notification
  # ==================================================

  notify_slack:

    name: 🔔 Notify Slack

    runs-on: ubuntu-latest

    needs:
      - laravel-tests

    if: ${{ failure() }}

    steps:

      - name: 🔔 Send Slack Notification

        uses: slackapi/slack-github-action@v2.1.1

        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

          webhook-type: incoming-webhook

          payload: |
            {
              "text": "❌ Laravel Tests Failed",
              "attachments": [
                {
                  "color": "danger",
                  "text": "Laravel tests or coverage check failed. Please check the GitHub Actions run."
                }
              ]
            }

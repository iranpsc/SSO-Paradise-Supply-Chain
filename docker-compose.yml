name: sso

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-SSO}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_KEY: ${APP_KEY:-}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DOCKER_DB_DATABASE:-sso}
  DB_USERNAME: ${DOCKER_DB_USERNAME:-sso}
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-sso}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-mailpit}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_USERNAME: ${MAIL_USERNAME:-null}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-info@sso.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SSO}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sso-app:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-environment
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${APP_PORT:-8080}:80"
    expose:
      - "80"
    volumes:
      - ${SSO_DATA_DIR:-/opt/sso}/storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sso
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  queue:
    image: sso-app:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-environment
      CONTAINER_ROLE: queue
      RUN_MIGRATIONS: "false"
    volumes:
      - ${SSO_DATA_DIR:-/opt/sso}/storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: php artisan queue:work redis --sleep=1 --tries=3 --backoff=3 --max-time=3600 --max-jobs=1000
    networks:
      - sso
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    image: sso-app:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-environment
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"
    volumes:
      - ${SSO_DATA_DIR:-/opt/sso}/storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: php artisan schedule:work
    networks:
      - sso
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-sso}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-sso}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-sso}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    expose:
      - "3306"
    volumes:
      - ${SSO_DATA_DIR:-/opt/sso}/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - sso
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    expose:
      - "6379"
    volumes:
      - ${SSO_DATA_DIR:-/opt/sso}/redis:/data
    networks:
      - sso
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    expose:
      - "1025"
      - "8025"
    networks:
      - sso
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sso:
    driver: bridge
